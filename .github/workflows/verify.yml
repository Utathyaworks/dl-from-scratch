name: verify notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  notebooks:
    name: notebooks execute cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tensorflow-cpu

      - name: Notebooks must match their .py sources
        # Compares cell sources only. Committed notebooks keep their executed
        # outputs so GitHub renders the plots, and those outputs contain
        # timings that never reproduce byte-for-byte.
        run: python tools/build_nb.py --check

      - name: Execute every notebook headless
        run: python tools/verify.py

  package:
    name: package installs and passes its tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      # Installed from the wheel, not from the source tree, so this also
      # proves the notebooks and site were actually bundled into it.
      - name: Install the wheel
        shell: bash
        run: pip install "$(ls dist/*.whl)" pytest

      - name: Run the test suite
        run: pytest tests/ -q

      - name: The CLI works end to end
        shell: bash
        run: |
          dlscratch --version
          dlscratch list --available
          dlscratch info 7
          dlscratch where
          dlscratch open 1 --no-launch --dir "$RUNNER_TEMP/lesson-check"
          test -f "$RUNNER_TEMP/lesson-check/01-tensors-and-vectors.ipynb"
          echo "notebook extracted from the installed package OK"
